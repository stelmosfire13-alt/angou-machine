<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あんごうマシーン  -Coded Message Generator-</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1d2130;
    --muted: #6b7280;
    --border: #d9dce5;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c;
      --card: #1c1f2b;
      --text: #e8eaf2;
      --muted: #9aa0b4;
      --border: #333849;
      --accent: #818cf8;
      --accent-text: #12141c;
      --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea, input, select {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea[readonly] { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button {
    font: inherit;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:hover { filter: brightness(1.05); }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
  .status { min-height: 1.5em; margin-top: 12px; font-size: 0.9rem; color: var(--muted); }
  .status.error { color: var(--error); }
  .hidden { display: none; }
  .lang { text-align: right; font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
  .lang a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <nav class="lang"><span>日本語</span> | <a href="en.html" hreflang="en">English</a></nav>
  <h1>あんごうマシーン <small>-Coded Message Generator-</small></h1>
  <p class="lead">文章を入力して暗号化・復号できます。処理はすべてブラウザ内で行われ、入力した文章やパスワードは外部に送信されません。</p>

  <div class="card">
    <label for="mode">暗号方式</label>
    <select id="mode">
      <option value="aes">AES-256（パスワード方式・安全）</option>
      <option value="caesar" selected>シーザー暗号（文字をずらす・お遊び用）</option>
      <option value="reverse">逆さ文（文章を逆に並べる・お遊び用）</option>
    </select>

    <div id="aes-opts" class="hidden">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="off" placeholder="復号にも同じパスワードが必要です">
    </div>

    <div id="caesar-opts">
      <label for="shift">ずらす数</label>
      <input id="shift" type="number" value="3">
      <p class="hint">英字・数字・ひらがな・カタカナをずらします。復号は同じ数で戻します。</p>
    </div>

    <div id="reverse-opts" class="hidden">
      <p class="hint">文章を後ろから並べ直します（例：あいうえお → おえういあ）。復号ももう一度逆にするだけです。</p>
    </div>

    <label for="input">入力</label>
    <textarea id="input" placeholder="例：こんにちは"></textarea>

    <div class="row">
      <button class="primary" id="encrypt">暗号化する</button>
      <button id="decrypt">復号する</button>
    </div>

    <label for="output">結果</label>
    <textarea id="output" readonly></textarea>

    <div class="row">
      <button id="copy">結果をコピー</button>
      <button id="swap">結果を入力に移す</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</main>

<footer style="text-align:center; padding:18px 0 14px; margin-top:10px;">
  <img id="accessCounter" alt="アクセスカウンター" style="height:20px; vertical-align:middle; opacity:0; transition:opacity 0.3s;">
</footer>
<script>
  (function () {
    const img = document.getElementById('accessCounter');
    img.src = 'https://hits.dwyl.com/angou-generator-app/index.html.svg?style=flat-square';
    img.onload  = () => { img.style.opacity = '1'; };
    img.onerror = () => { img.style.display = 'none'; };
  })();
</script>

<script>
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", isError);
}

// ---- AES-GCM（PBKDF2でパスワードから鍵を生成） ----
const ITERATIONS = 200000;

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

function toBase64(bytes) {
  let s = "";
  bytes.forEach((b) => (s += String.fromCharCode(b)));
  return btoa(s);
}

function fromBase64(str) {
  const s = atob(str.trim());
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

async function aesEncrypt(text, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text)));
  const out = new Uint8Array(salt.length + iv.length + cipher.length);
  out.set(salt, 0);
  out.set(iv, 16);
  out.set(cipher, 28);
  return toBase64(out);
}

async function aesDecrypt(b64, password) {
  const data = fromBase64(b64);
  const key = await deriveKey(password, data.slice(0, 16));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(16, 28) }, key, data.slice(28));
  return dec.decode(plain);
}

// ---- シーザー暗号 ----
const RANGES = [
  [0x41, 0x5a], // A-Z
  [0x61, 0x7a], // a-z
  [0x30, 0x39], // 0-9
  [0x3041, 0x3096], // ひらがな
  [0x30a1, 0x30fa], // カタカナ
];

function caesar(text, shift) {
  return Array.from(text, (ch) => {
    const code = ch.codePointAt(0);
    for (const [start, end] of RANGES) {
      if (code >= start && code <= end) {
        const size = end - start + 1;
        return String.fromCodePoint(start + ((((code - start + shift) % size) + size) % size));
      }
    }
    return ch;
  }).join("");
}

// ---- 逆さ文 ----
// 絵文字や濁点付きの文字が崩れないよう、見た目の1文字単位で逆にする
function reverseText(text) {
  const seg = new Intl.Segmenter("ja", { granularity: "grapheme" });
  return Array.from(seg.segment(text), (x) => x.segment).reverse().join("");
}

// ---- UI ----
$("mode").addEventListener("change", () => {
  const mode = $("mode").value;
  $("aes-opts").classList.toggle("hidden", mode !== "aes");
  $("caesar-opts").classList.toggle("hidden", mode !== "caesar");
  $("reverse-opts").classList.toggle("hidden", mode !== "reverse");
  setStatus("");
});

// X(Twitter)の文字数カウント（twitter-text v3 の重み付けに準拠）
// 半角英数・記号・スペース・改行 = 1、日本語などの全角文字・絵文字 = 2、URL = 23。上限は280。
const X_LIMIT = 280;
const X_LIGHT_RANGES = [[0x0000, 0x10ff], [0x2000, 0x200d], [0x2010, 0x201f], [0x2032, 0x2037]];
const URL_RE = /https?:\/\/[^\s]+/g;
const EMOJI_RE = /\p{Extended_Pictographic}|\p{Regional_Indicator}/u;

function xWeight(text) {
  let s = text.normalize("NFC");
  let total = 0;
  s = s.replace(URL_RE, () => { total += 23; return ""; });
  const seg = new Intl.Segmenter("ja", { granularity: "grapheme" });
  for (const { segment } of seg.segment(s)) {
    if (EMOJI_RE.test(segment)) { total += 2; continue; }
    for (const ch of segment) {
      const c = ch.codePointAt(0);
      total += X_LIGHT_RANGES.some(([a, b]) => c >= a && c <= b) ? 1 : 2;
    }
  }
  return total;
}

function countLabel(text) {
  const n = xWeight(text) / 2; // 全角1文字 = 1、半角1文字 = 0.5
  return `${X_LIMIT / 2}文字中${n}文字${n > X_LIMIT / 2 ? "・上限オーバー" : ""}`;
}

const ENC_MSG = () => `暗号化しました。（${countLabel($("output").value)}）`;
const DEC_MSG = () => `復号しました。（${countLabel($("output").value)}）`;

async function run(direction) {
  const text = $("input").value;
  if (!text) return setStatus("文章を入力してください。", true);

  if ($("mode").value === "reverse") {
    $("output").value = reverseText(text);
    return setStatus(direction === "encrypt" ? ENC_MSG() : DEC_MSG());
  }

  if ($("mode").value === "caesar") {
    const shift = parseInt($("shift").value, 10) || 0;
    $("output").value = caesar(text, direction === "encrypt" ? shift : -shift);
    return setStatus(direction === "encrypt" ? `暗号化しました。（${countLabel($("output").value)}）` : `復号しました。（${countLabel($("output").value)}）`);
  }

  const password = $("password").value;
  if (!password) return setStatus("パスワードを入力してください。", true);
  try {
    if (direction === "encrypt") {
      $("output").value = await aesEncrypt(text, password);
      setStatus(`暗号化しました。（${countLabel($("output").value)}）同じパスワードで復号できます。`);
    } else {
      $("output").value = await aesDecrypt(text, password);
      setStatus(`復号しました。（${countLabel($("output").value)}）`);
    }
  } catch {
    $("output").value = "";
    setStatus("復号に失敗しました。パスワードか暗号文が正しくありません。", true);
  }
}

$("encrypt").addEventListener("click", () => run("encrypt"));
$("decrypt").addEventListener("click", () => run("decrypt"));

$("copy").addEventListener("click", async () => {
  if (!$("output").value) return;
  try {
    await navigator.clipboard.writeText($("output").value);
    setStatus("コピーしました。");
  } catch {
    $("output").select();
    setStatus("自動コピーできませんでした。選択された結果を手動でコピーしてください。", true);
  }
});

$("swap").addEventListener("click", () => {
  $("input").value = $("output").value;
  $("output").value = "";
  setStatus("");
});
</script>
</body>
</html>
